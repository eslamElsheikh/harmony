[tool.poetry]
name = "TreatmentPlan"
version = "0.1.0"
description = "TreatmentPlan"
authors = ["Eslam_Elsheikh <elsheikh2326@gamil.com>"]

[tool.poetry.dependencies]
python = ">=3.10.0,<3.12"
crewai = {extras = ['tools'], version = "^0.22.4"}
load-dotenv = "^0.1.0"
crewai-tools = "^0.0.15"
duckduckgo-search = "^4.4.2"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.3"
pydantic = "^2.6.3"
flask = "^3.0.2"
flask-cors = "^4.0.0"
langchain-google-genai = "^1.0.3"
[tool.pyright]

useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"